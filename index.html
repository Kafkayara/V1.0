<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelacak Pengeluaran Mahasiswa</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header Aplikasi -->
    <header class="app-header">
      <h1>Pelacak Pengeluaran</h1>
      <p class="app-subtitle">Pantau dan kelola pengeluaran harianmu dengan praktis.</p>
    </header>

    <main class="app-main">
      <!-- Ringkasan / Dashboard -->
      <section class="summary-section" aria-label="Ringkasan Keuangan">
        <div class="summary-card total-card">
          <span class="summary-label">Total Pengeluaran</span>
          <output id="totalExpense" class="summary-value">Rp0</output>
        </div>
        <div class="summary-card">
          <span class="summary-label">Pengeluaran Bulan Ini</span>
          <output id="monthlyExpense" class="summary-value">Rp0</output>
        </div>
        <div class="summary-card">
          <span class="summary-label">Total Transaksi</span>
          <output id="totalTransactions" class="summary-value">0</output>
        </div>
      </section>

      <!-- Form Tambah/Edit Pengeluaran -->
      <section class="form-section" aria-labelledby="formTitle">
        <h2 id="formTitle">Catat Pengeluaran</h2>
        
        <!-- Notifikasi / Feedback Banner -->
        <div id="feedbackMessage" class="feedback-message hidden" role="status" aria-live="polite"></div>

        <form id="expenseForm" novalidate>
          <input type="hidden" id="expenseId" value="">

          <div class="form-group">
            <label for="expenseName">Nama Pengeluaran</label>
            <input 
              type="text" 
              id="expenseName" 
              name="expenseName" 
              placeholder="Contoh: Nasi padang, Buku tulis"
              required
            >
            <span class="field-error" id="nameError" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="expenseAmount">Nominal (Rp)</label>
            <input 
              type="number" 
              id="expenseAmount" 
              name="expenseAmount" 
              placeholder="Contoh: 25000"
              min="1"
              step="1"
              required
            >
            <span class="field-error" id="amountError" aria-live="polite"></span>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="expenseDate">Tanggal</label>
              <input 
                type="date" 
                id="expenseDate" 
                name="expenseDate" 
                required
              >
              <span class="field-error" id="dateError" aria-live="polite"></span>
            </div>

            <div class="form-group">
              <label for="expenseCategory">Kategori</label>
              <select id="expenseCategory" name="expenseCategory" required>
                <option value="" disabled selected>Pilih Kategori</option>
                <option value="Makanan">Makanan</option>
                <option value="Transportasi">Transportasi</option>
                <option value="Pendidikan">Pendidikan</option>
                <option value="Tagihan">Tagihan</option>
                <option value="Belanja">Belanja</option>
                <option value="Hiburan">Hiburan</option>
                <option value="Lainnya">Lainnya</option>
              </select>
              <span class="field-error" id="categoryError" aria-live="polite"></span>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" id="submitBtn" class="btn btn-primary">Simpan Transaksi</button>
            <button type="button" id="cancelEditBtn" class="btn btn-secondary hidden">Batal</button>
          </div>
        </form>
      </section>

      <!-- Daftar Riwayat Pengeluaran -->
      <section class="list-section" aria-labelledby="listTitle">
        <div class="list-header">
          <h2 id="listTitle">Riwayat Pengeluaran</h2>
        </div>

        <!-- Wadah List Dinamis (akan dirender via JS) -->
        <div id="expenseList" class="expense-list"></div>

        <!-- State Kosong (Default Tampil Awal) -->
        <div id="emptyState" class="empty-state">
          <h3>Belum ada pengeluaran</h3>
          <p>Catat pengeluaran pertamamu untuk mulai memantau penggunaan uangmu.</p>
        </div>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
