<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pelacak Pengeluaran V1.0</title>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>

        <h1>Pelacak Pengeluaran Mahasigma</h1>

        <form id="form-pengeluaran">
            <div>
                <label for="input-nama">Nama pengeluaran</label>
                <input type="text" id="input-nama" required>
            </div>

            <div>
                <label for="input-nominal">Nominal (Rp)</label>
                <input type="number" id="input-nominal" required>
            </div>

            <div>
                <label for="input-tanggal">Tanggal</label>
                <input type="date" id="input-tanggal" required>
            </div>

            <button type="submit">Tambah</button>
        </form>

        <h2>Daftar Pengeluaran</h2>
        <ul id="daftar-pengeluaran"></ul>
        <h2>Total: Rp <span id="total-pengeluaran">0</span></h2>

        <script src="js/app.js"></script>
    </body>
</html>
